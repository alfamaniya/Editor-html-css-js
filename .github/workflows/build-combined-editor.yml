name: Build Combined Editor

on:
  workflow_run:
    workflows:
      - Check index file
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  build-combined:
    name: Build and validate the single-file distribution
    if: ${{ false }} # Legacy single-file build intentionally disabled; retained for reference.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the standalone main Editor
        run: node scripts/build-test-editor.mjs

      - name: Validate the standalone main Editor
        run: node scripts/check-standalone-editor.mjs

      - name: Build the standalone Visual Editor
        run: node scripts/build-standalone-visual-editor.mjs

      - name: Validate the standalone Visual Editor
        run: node scripts/check-standalone-visual-editor.mjs

      - name: Build the combined single-file Editor V
        run: node scripts/build-combined-editor.mjs

      - name: Validate the combined single-file Editor V
        run: |
          node --check scripts/check-combined-editor.mjs
          node scripts/check-combined-editor.mjs

      - name: Upload the generated single-file distribution
        uses: actions/upload-artifact@v4
        with:
          name: editor-v-html
          path: editor v.html
          if-no-files-found: error
          retention-days: 14
