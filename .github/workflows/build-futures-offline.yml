name: Build Futures Offline Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "futures/**"
      - "!futures/offline-dashboard-futures.html"
      - "scripts/build-futures-offline.mjs"
      - "package.json"
      - ".github/workflows/build-futures-offline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futures-offline-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build standalone offline HTML
        run: node scripts/build-futures-offline.mjs

      - name: Commit updated offline dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add futures/offline-dashboard-futures.html
          if git diff --cached --quiet; then
            echo "Offline dashboard is already up to date."
            exit 0
          fi
          git commit -m "Build Futures offline dashboard"
          git push origin HEAD:main
