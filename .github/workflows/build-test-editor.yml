name: ساخت و انتشار فایل مستقل editor v.html

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "src/**"
      - "scripts/**"
      - "tools/build-single-file.js"
      - ".github/workflows/build-test-editor.yml"
  workflow_dispatch:
    inputs:
      confirm_build:
        description: "تأیید صریح ساخت و ثبت فایل‌های مستقل"
        required: true
        type: boolean
        default: false

concurrency:
  group: build-test-editor-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-standalone:
    if: github.event_name == 'push' || inputs.confirm_build == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          ref: main

      - name: آماده‌سازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: بررسی نحو اسکریپت‌های ساخت و اعتبارسنجی
        run: |
          for file in scripts/*.mjs tools/build-single-file.js; do
            node --check "$file"
          done

      - name: بررسی نحو فایل‌های JavaScript اصلی
        run: |
          for file in src/features/suggestions/data/html-suggestions.js src/features/suggestions/data/css-suggestions.js src/features/suggestions/data/js-suggestions.js src/features/suggestions/manager/suggestion-manager.js src/features/suggestions/next-word/next-word-suggestions.js src/features/live-preview/element-inspector.js script.js src/features/settings/settings.js src/features/backup-restore/backup-restore.js src/features/word-tree/word-tree.js src/features/visual-editor/visual-editor-session.js src/features/visual-editor/visual-editor.js; do
            node --check "$file"
          done

      - name: بررسی یکپارچگی فایل اصلی
        run: node scripts/check-index-integrity.mjs

      - name: بررسی جایگاه دکمهٔ تنظیمات در هدر اصلی
        run: node scripts/check-settings-button-placement.mjs

      - name: آزمون تشخیص رنگ و جایگاه پالت رنگ
        run: node scripts/check-color-picker.mjs

      - name: آزمون پردازش و درج کدهای چسبانده‌شده
        run: node scripts/check-editor-code-processing.mjs

      - name: آزمون هم‌ترازی لایه‌های ویرایشگر و دقت مکان‌نما
        run: node scripts/check-editor-overlay-alignment.mjs

      - name: آزمون دسترس‌پذیری صفحه‌کلید در پنجرهٔ تنظیمات
        run: node scripts/check-settings-dialog-keyboard.mjs

      - name: آزمون اعتبارسنجی و بازیابی نسخهٔ پشتیبان
        run: node scripts/check-backup-restore.mjs

      - name: ساخت فایل مستقل Editor
        run: node scripts/build-test-editor.mjs

      - name: اعتبارسنجی فایل مستقل Editor
        run: node scripts/check-standalone-editor.mjs

      - name: ساخت نسخهٔ مستقل کامل Visual Editor
        run: node scripts/build-standalone-visual-editor.mjs

      - name: اعتبارسنجی نسخهٔ مستقل کامل Visual Editor
        run: node scripts/check-standalone-visual-editor.mjs

      - name: ساخت فایل یکپارچهٔ نهایی
        run: node scripts/build-combined-editor.mjs

      - name: اعتبارسنجی فایل یکپارچهٔ نهایی
        run: node scripts/check-combined-editor.mjs
      - name: نصب Playwright و مرورگر Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: آزمون واقعی دو محیط در مرورگر
        run: node scripts/check-combined-editor-browser.mjs

      - name: ثبت و انتشار فایل یکپارچه
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -f "editor v.html"
          git rm -f --ignore-unmatch index-test-etitor.html standalone-visual-editor.html
          if git diff --cached --quiet -- "editor v.html" index-test-etitor.html standalone-visual-editor.html; then
            echo "فایل یکپارچه از قبل با منابع هماهنگ است."
            exit 0
          fi
          git commit \
            -m "تولید و انتشار فایل یکپارچهٔ editor v.html" \
            -m "محیط Editor اصلی و Visual Editor در یک سند HTML مستقل بسته‌بندی شدند." \
            -m "منابع CSS و JavaScript هر دو محیط به‌صورت داخلی جاسازی و تطابق محتوای اسناد بررسی شد." \
            -m "خروجی‌های قدیمی index-test-etitor.html و standalone-visual-editor.html حذف شدند."
          git push origin HEAD:main
