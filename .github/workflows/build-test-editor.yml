name: Build standalone test editor

on:
  # همگام‌سازی خودکار خروجی مستقل پس از تغییر هر منبع مؤثر بر آن.
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "src/**"
      - "scripts/**"
      - "tools/build-single-file.js"
      - ".github/workflows/build-test-editor.yml"

  # اجرای دستی همچنان نیازمند تأیید صریح است.
  workflow_dispatch:
    inputs:
      confirm_build:
        description: "تأیید صریح ساخت و ثبت فایل مستقل"
        required: true
        type: boolean
        default: false

# از اجرای هم‌زمان چند بازسازی روی شاخهٔ اصلی جلوگیری می‌کند.
concurrency:
  group: build-test-editor-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-standalone:
    if: github.event_name == 'push' || inputs.confirm_build == true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v7
        with:
          ref: main

      - name: آماده‌سازی نسخهٔ پشتیبانی‌شدهٔ Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: بررسی نحو فایل‌های جاوااسکریپت و اسکریپت‌های اعتبارسنجی
        run: |
          for file in src/features/suggestions/data/html-suggestions.js src/features/suggestions/data/css-suggestions.js src/features/suggestions/data/js-suggestions.js src/features/suggestions/manager/suggestion-manager.js src/features/suggestions/next-word/next-word-suggestions.js src/features/live-preview/element-inspector.js script.js src/features/settings/settings.js src/features/backup-restore/backup-restore.js src/features/word-tree/word-tree.js scripts/*.mjs tools/build-single-file.js; do
            node --check "$file"
          done

      - name: بررسی یکپارچگی فایل اصلی
        run: node scripts/check-index-integrity.mjs

      - name: آزمون پردازش و درج کدهای چسبانده‌شده
        run: node scripts/check-editor-code-processing.mjs

      - name: آزمون هم‌ترازی لایه‌های ویرایشگر و دقت مکان‌نما
        run: node scripts/check-editor-overlay-alignment.mjs

      - name: آزمون دسترس‌پذیری صفحه‌کلید در پنجرهٔ تنظیمات
        run: node scripts/check-settings-dialog-keyboard.mjs

      - name: آزمون اعتبارسنجی و بازیابی نسخهٔ پشتیبان
        run: node scripts/check-backup-restore.mjs

      - name: ساخت فایل مستقل از منابع اصلی
        run: node scripts/build-test-editor.mjs

      - name: اعتبارسنجی کامل فایل مستقل تولیدشده
        run: node scripts/check-standalone-editor.mjs

      - name: ثبت تغییرات فایل مستقل
        run: |
          if git diff --quiet -- index-test-etitor.html; then
            echo "فایل مستقل از قبل با منابع هماهنگ است."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index-test-etitor.html
          git commit \
            -m "بازسازی فایل مستقل ویرایشگر و همگام‌سازی با منابع" \
            -m "منابع HTML، CSS و JavaScript در خروجی مستقل بازتولید شدند." \
            -m "اعتبارسنجی ساختار HTML، نحو اسکریپت‌ها و یکپارچگی منابع جاسازی‌شده انجام شد." \
            -m "آزمون‌های پردازش کد، صفحه‌کلید تنظیمات و بازیابی نسخهٔ پشتیبان اجرا شدند."
          git push origin HEAD:main
