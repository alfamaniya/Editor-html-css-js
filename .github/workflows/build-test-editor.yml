name: Build standalone test editor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          for file in html-suggestions.js css-suggestions.js js-suggestions.js next-word-suggestions.js script.js word-tree.js github-update.js scripts/build-test-editor.mjs scripts/check-index-integrity.mjs scripts/check-standalone-editor.mjs tools/build-single-file.js; do
            node --check "$file"
          done

      - name: Build the single-file editor
        run: node scripts/build-test-editor.mjs

      - name: Validate standalone HTML and embedded JavaScript
        run: node scripts/check-standalone-editor.mjs

      - name: Commit the updated bundle when it changed
        run: |
          if git diff --quiet -- index-test-etitor.html; then
            echo "Standalone bundle is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-test-etitor.html
          git commit -m "chore: rebuild standalone test editor"
          git push
