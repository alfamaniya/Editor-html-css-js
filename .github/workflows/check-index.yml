name: Check index file

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "locales/**"
      - "src/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/check-index.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "locales/**"
      - "src/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/check-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-index:
    name: Validate editor sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify required source files
        run: |
          test -s index.html
          test -s style.css
          test -s script.js

      - name: Check index integrity
        run: node scripts/check-index-integrity.mjs

      - name: Build standalone editor for source validation
        run: node scripts/build-test-editor.mjs

      - name: Validate standalone editor and embedded assets
        run: node scripts/check-standalone-editor.mjs

      - name: Test HTML paste processing
        run: node scripts/check-editor-code-processing.mjs

      - name: Test nested settings dialog keyboard handling
        run: node scripts/check-settings-dialog-keyboard.mjs

      - name: Test backup validation and recovery logic
        run: node scripts/check-backup-restore.mjs

      - name: Check JavaScript syntax
        run: |
          for file in script.js src/features/settings/settings.js src/features/suggestions/manager/suggestion-manager.js src/features/word-tree/word-tree.js src/features/suggestions/data/html-suggestions.js src/features/suggestions/data/css-suggestions.js src/features/suggestions/data/js-suggestions.js src/features/suggestions/next-word/next-word-suggestions.js src/features/backup-restore/backup-restore.js src/shared/i18n/i18n.js; do
            if [ -f "$file" ]; then
              node --check "$file"
            fi
          done
