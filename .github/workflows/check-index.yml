name: Check index file

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "editor v.html"
      - "scripts/check-combined-editor.mjs"
      - "style.css"
      - "script.js"
      - "src/features/settings/settings.css"
      - "src/features/settings/settings.js"
      - "src/features/suggestions/manager/suggestion-manager.js"
      - "src/features/suggestions/manager/suggestion-manager.css"
      - "src/features/backup-restore/backup-restore.css"
      - "src/features/backup-restore/backup-restore.js"
      - "scripts/check-backup-restore.mjs"
      - "src/features/word-tree/word-tree.js"
      - "src/features/integrations/github/github-update.js"
      - "src/features/suggestions/data/html-suggestions.js"
      - "src/features/suggestions/data/css-suggestions.js"
      - "src/features/suggestions/data/js-suggestions.js"
      - "src/features/suggestions/next-word/next-word-suggestions.js"
      - "README.md"
      - ".github/workflows/check-index.yml"
      - "scripts/check-editor-code-processing.mjs"
      - "scripts/check-settings-dialog-keyboard.mjs"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "src/features/settings/settings.css"
      - "src/features/settings/settings.js"
      - "src/features/suggestions/manager/suggestion-manager.js"
      - "src/features/suggestions/manager/suggestion-manager.css"
      - "src/features/backup-restore/backup-restore.css"
      - "src/features/backup-restore/backup-restore.js"
      - "scripts/check-backup-restore.mjs"
      - "src/features/word-tree/word-tree.js"
      - "src/features/integrations/github/github-update.js"
      - "src/features/suggestions/data/html-suggestions.js"
      - "src/features/suggestions/data/css-suggestions.js"
      - "src/features/suggestions/data/js-suggestions.js"
      - "src/features/suggestions/next-word/next-word-suggestions.js"
      - "README.md"
      - ".github/workflows/check-index.yml"
      - "scripts/check-editor-code-processing.mjs"
      - "scripts/check-settings-dialog-keyboard.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-index:
    name: Validate index.html
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify index file exists and is not empty
        run: |
          test -f index.html
          test -s index.html

      - name: Check required document structure
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const html = readFileSync('index.html', 'utf8');
          const required = [
            ['HTML doctype', /<!doctype\s+html\s*>/i],
            ['opening html element', /<html\b/i],
            ['head element', /<head\b/i],
            ['body element', /<body\b/i],
            ['closing body element', /<\/body\s*>/i],
            ['closing html element', /<\/html\s*>/i],
          ];

          const missing = required
            .filter(([, pattern]) => !pattern.test(html))
            .map(([label]) => label);

          if (missing.length) {
            console.error('index.html is missing required structure:');
            for (const item of missing) console.error(`- ${item}`);
            process.exit(1);
          }

          console.log('index.html contains the required document structure.');
          NODE

      - name: Verify local CSS and JavaScript references
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';

          const html = readFileSync('index.html', 'utf8');
          const references = [];
          const patterns = [
            /<script\b[^>]*\bsrc\s*=\s*["']([^"'#?]+)(?:[?#][^"']*)?["'][^>]*>/gi,
            /<link\b[^>]*\bhref\s*=\s*["']([^"'#?]+)(?:[?#][^"']*)?["'][^>]*>/gi,
          ];

          for (const pattern of patterns) {
            for (const match of html.matchAll(pattern)) {
              const reference = match[1].trim();
              if (!reference || /^(?:[a-z]+:|\/\/|#)/i.test(reference) || reference.startsWith('/')) continue;
              references.push(reference);
            }
          }

          const missing = [...new Set(references)].filter((reference) => {
            const cleanPath = decodeURIComponent(reference).replaceAll('\\', '/');
            return !existsSync(resolve(process.cwd(), cleanPath));
          });

          if (missing.length) {
            console.error('index.html references missing local assets:');
            for (const file of missing) console.error(`- ${file}`);
            process.exit(1);
          }

          console.log(`Checked ${new Set(references).size} local asset reference(s); all exist.`);
          NODE

      - name: Test HTML paste processing
        run: node scripts/check-editor-code-processing.mjs

      - name: Validate the complete standalone Editor V bundle
        run: |
          node --check scripts/check-combined-editor.mjs
          node scripts/check-combined-editor.mjs

      - name: Test nested settings dialog keyboard handling
        run: node scripts/check-settings-dialog-keyboard.mjs

      - name: Test backup validation and recovery logic
        run: node scripts/check-backup-restore.mjs

      - name: Check JavaScript syntax used by the index page
        run: |
          for file in script.js src/features/settings/settings.js src/features/suggestions/manager/suggestion-manager.js src/features/word-tree/word-tree.js src/features/integrations/github/github-update.js src/features/suggestions/data/html-suggestions.js src/features/suggestions/data/css-suggestions.js src/features/suggestions/data/js-suggestions.js src/features/suggestions/next-word/next-word-suggestions.js src/features/backup-restore/backup-restore.js; do
            if [ -f "$file" ]; then
              node --check "$file"
            fi
          done
