name: Manual HTML Email Delivery

on:
  workflow_dispatch:
    inputs:
      code_to_send:
        description: "Which version should be sent?"
        required: true
        type: choice
        options:
          - "Main Editor"
          - "Visual Editor"
          - "Combined Editor"
          - "Futures — futures/offline-dashboard-futures.html"
        default: "Futures — futures/offline-dashboard-futures.html"
      confirm_send:
        description: "I confirm sending the selected code by email."
        required: true
        type: boolean
        default: false
      recipient:
        description: "Choose the email address that will receive the message."
        required: true
        type: choice
        options:
          - "a.mamghanian@isaco.ir"
          - "alfamaniya93@gmail.com"
        default: "a.mamghanian@isaco.ir"

permissions:
  contents: read

jobs:
  send:
    name: Build and send selected version
    if: inputs.confirm_send == true
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      SELECTED_CODE: ${{ inputs.code_to_send }}
      RECIPIENT: ${{ inputs.recipient }}
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Main Editor
        if: env.SELECTED_CODE == 'Main Editor' || env.SELECTED_CODE == 'Combined Editor'
        run: node scripts/build-test-editor.mjs

      - name: Validate Main Editor
        if: env.SELECTED_CODE == 'Main Editor' || env.SELECTED_CODE == 'Combined Editor'
        run: node scripts/check-standalone-editor.mjs

      - name: Build Visual Editor
        if: env.SELECTED_CODE == 'Visual Editor' || env.SELECTED_CODE == 'Combined Editor'
        run: node scripts/build-standalone-visual-editor.mjs

      - name: Validate Visual Editor
        if: env.SELECTED_CODE == 'Visual Editor' || env.SELECTED_CODE == 'Combined Editor'
        run: node scripts/check-standalone-visual-editor.mjs

      - name: Build Combined Editor
        if: env.SELECTED_CODE == 'Combined Editor'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-combined-editor.mjs
          node scripts/check-combined-editor.mjs
          test -s "editor v.html"

      - name: Build standalone Futures HTML
        if: startsWith(env.SELECTED_CODE, 'Futures')
        run: |
          set -euo pipefail
          node scripts/build-futures-offline.mjs
          test -s futures/offline-dashboard-futures.html

      - name: Prepare email content
        shell: bash
        run: |
          set -euo pipefail
          case "$SELECTED_CODE" in
            "Main Editor") file="index-test-etitor.html"; label="Main Editor" ;;
            "Visual Editor") file="standalone-visual-editor.html"; label="Visual Editor" ;;
            "Combined Editor") file="editor v.html"; label="Combined Editor and Visual Editor" ;;
            "Futures — futures/offline-dashboard-futures.html") file="futures/offline-dashboard-futures.html"; label="futures/offline-dashboard-futures.html" ;;
            *) echo "::error::انتخاب کد نامعتبر است."; exit 1 ;;
          esac
          test -s "$file"
          mkdir -p dist/company-delivery
          {
            printf 'Project: Editor-html-css-js\n'
            printf 'Selected version: %s\n' "$label"
            printf 'Repository: %s\n' "$GITHUB_REPOSITORY"
            printf 'Branch: main\n'
            printf 'Commit: %s\n' "$(git rev-parse HEAD)"
            printf 'Source file: %s\n' "$file"
            printf '\nThis is an informational email. No files are attached.\n'
          } > dist/company-delivery/selected-code-email.txt
          test -s dist/company-delivery/selected-code-email.txt

      - name: Validate SMTP configuration
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SMTP_SERVER SMTP_PORT SMTP_USERNAME SMTP_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret ${name} تنظیم نشده است."
              exit 1
            fi
          done
          if [[ ! "$SMTP_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::SMTP_PORT باید عدد معتبر باشد."
            exit 1
          fi
          if [[ -n "$SMTP_SECURE" && "$SMTP_SECURE" != "true" && "$SMTP_SECURE" != "false" ]]; then
            echo "::error::SMTP_SECURE فقط می‌تواند true یا false باشد."
            exit 1
          fi

      - name: Validate recipient email
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RECIPIENT" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "::error::آدرس ایمیل گیرنده معتبر نیست."
            exit 1
          fi

      - name: Send selected code by email
        if: inputs.confirm_send == true
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "نسخهٔ انتخاب‌شده از Editor-html-css-js"
          to: ${{ env.RECIPIENT }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: "file://dist/company-delivery/selected-code-email.txt"
