name: ارسال کد کامل editor v.html به ایمیل شرکت
on:
  workflow_dispatch:
    inputs:
      confirm_send:
        description: "ارسال محتوای کامل فایل editor v.html در متن ایمیل را تأیید می‌کنم"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: company-delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  send:
    name: اعتبارسنجی و ارسال فایل یکپارچه
    if: inputs.confirm_send == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: دریافت نسخهٔ ثبت‌شده در مخزن
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: آماده‌سازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: بررسی فایل نهایی بدون بازتولید
        shell: bash
        run: |
          set -euo pipefail
          test -s "editor v.html"
          node --check scripts/check-combined-editor.mjs
          node scripts/check-combined-editor.mjs
          echo "نسخهٔ ثبت‌شده اعتبارسنجی شد؛ این Workflow فایل را بازتولید نمی‌کند."
      - name: آماده‌سازی متن کامل ایمیل
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/company-delivery
          {
            printf 'پروژه: Editor-html-css-js\\n'
            printf 'فایل تحویلی: editor v.html\\n'
            printf 'محتوا: نسخهٔ یکپارچهٔ Editor و Visual Editor\\n'
            printf 'مخزن: %s\\n' "$GITHUB_REPOSITORY"
            printf 'شاخهٔ فایل تحویلی: main\\n'
            printf 'شناسهٔ کامیت اجرا: %s\\n' "$GITHUB_SHA"
            printf '%s\\n' '============================================================'
            printf '%s\\n\\n' 'محتوای کامل فایل HTML در ادامه آمده است:'
            cat "editor v.html"
          } > dist/company-delivery/editor-v-email-body.txt
          test -s dist/company-delivery/editor-v-email-body.txt
          echo "حجم متن ایمیل: $(wc -c < dist/company-delivery/editor-v-email-body.txt) بایت"
      - name: بررسی تنظیمات SMTP
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          COMPANY_EMAIL: ${{ secrets.COMPANY_EMAIL }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SMTP_SERVER SMTP_PORT SMTP_USERNAME SMTP_PASSWORD COMPANY_EMAIL; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Secret ${name} تنظیم نشده است."; exit 1; fi
          done
          if [[ ! "$SMTP_PORT" =~ ^[0-9]+$ ]]; then echo "::error::SMTP_PORT باید عدد معتبر باشد."; exit 1; fi
          if [[ -n "$SMTP_SECURE" && "$SMTP_SECURE" != "true" && "$SMTP_SECURE" != "false" ]]; then echo "::error::SMTP_SECURE فقط می‌تواند true یا false باشد."; exit 1; fi
      - name: ارسال کد کامل در متن ایمیل
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "نسخهٔ کامل و یکپارچهٔ Editor V - ${{ github.sha }}"
          to: ${{ secrets.COMPANY_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: "file://dist/company-delivery/editor-v-email-body.txt"
