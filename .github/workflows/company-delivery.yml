name: ارسال نسخهٔ مستقل ویرایشگر به ایمیل شرکت
on:
  workflow_dispatch:
    inputs:
      confirm_send:
        description: "ارسال نسخهٔ کامل ویرایشگر HTML/CSS/JS را تأیید می‌کنم"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: company-delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  send:
    name: ساخت، اعتبارسنجی و ارسال نسخهٔ مستقل
    if: inputs.confirm_send == true
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: دریافت نسخهٔ ثبت‌شده در مخزن
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: آماده‌سازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: ساخت و بررسی نسخهٔ مستقل
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-test-editor.mjs
          node scripts/check-standalone-editor.mjs
          test -s index-test-etitor.html
      - name: آماده‌سازی متن کامل ایمیل
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/company-delivery
          {
            printf 'پروژه: Editor-html-css-js\n'
            printf 'فایل تحویلی: index-test-etitor.html (نسخهٔ مستقل ساخته‌شده از منابع)\n'
            printf 'مخزن: %s\n' "$GITHUB_REPOSITORY"
            printf 'شاخه: main\n'
            printf 'شناسهٔ کامیت: %s\n' "$(git rev-parse HEAD)"
            printf '%s\n' '============================================================'
            printf '%s\n\n' 'محتوای کامل فایل HTML در ادامه آمده است:'
            cat index-test-etitor.html
          } > dist/company-delivery/editor-email-body.txt
          test -s dist/company-delivery/editor-email-body.txt
          echo "حجم متن ایمیل: $(wc -c < dist/company-delivery/editor-email-body.txt) بایت"
      - name: بررسی تنظیمات SMTP
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          COMPANY_EMAIL: ${{ secrets.COMPANY_EMAIL }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SMTP_SERVER SMTP_PORT SMTP_USERNAME SMTP_PASSWORD COMPANY_EMAIL; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Secret ${name} تنظیم نشده است."; exit 1; fi
          done
          if [[ ! "$SMTP_PORT" =~ ^[0-9]+$ ]]; then echo "::error::SMTP_PORT باید عدد معتبر باشد."; exit 1; fi
          if [[ -n "$SMTP_SECURE" && "$SMTP_SECURE" != "true" && "$SMTP_SECURE" != "false" ]]; then echo "::error::SMTP_SECURE فقط می‌تواند true یا false باشد."; exit 1; fi
      - name: پردازش و اعتبارسنجی گیرندگان ایمیل
        id: recipients
        env:
          COMPANY_EMAIL: ${{ secrets.COMPANY_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',;' read -r -a raw_recipients <<< "$COMPANY_EMAIL"
          recipients=""
          for recipient in "${raw_recipients[@]}"; do
            recipient="$(printf '%s' "$recipient" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [[ -n "$recipient" ]] || continue
            if [[ "$recipient" != *@*.* || "$recipient" =~ [[:space:]] ]]; then
              echo "::error::یکی از آدرس‌های COMPANY_EMAIL معتبر نیست."
              exit 1
            fi
            if [[ -n "$recipients" ]]; then recipients+=", "; fi
            recipients+="$recipient"
          done
          if [[ -z "$recipients" ]]; then
            echo "::error::حداقل یک گیرنده معتبر باید در COMPANY_EMAIL ثبت شود."
            exit 1
          fi
          printf 'to=%s\n' "$recipients" >> "$GITHUB_OUTPUT"
      - name: ارسال کد کامل در متن ایمیل
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "نسخهٔ مستقل ویرایشگر HTML / CSS / JavaScript"
          to: ${{ steps.recipients.outputs.to }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: "file://dist/company-delivery/editor-email-body.txt"
