name: Manual HTML Email Delivery

on:
  workflow_dispatch:
    inputs:
      code_to_send:
        description: "Which version should be sent?"
        required: true
        type: choice
        options:
          - "Main Editor"
        default: "Main Editor"
      confirm_send:
        description: "I confirm sending the selected code by email."
        required: true
        type: boolean
        default: false
      recipient:
        description: "Choose the email address that will receive the message."
        required: true
        type: choice
        options:
          - "a.mamghanian@isaco.ir"
          - "alfamaniya93@gmail.com"
        default: "a.mamghanian@isaco.ir"

permissions:
  contents: read

jobs:
  prepare:
    name: Build and prepare email parts
    if: inputs.confirm_send == true
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.parts.outputs.matrix }}
    env:
      SELECTED_CODE: ${{ inputs.code_to_send }}
      RECIPIENT: ${{ inputs.recipient }}
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Main Editor
        run: node scripts/build-test-editor.mjs

      - name: Validate Main Editor
        run: node scripts/check-standalone-editor.mjs

      - name: Prepare email content parts
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const selected = process.env.SELECTED_CODE;
          const fileBySelection = {
            'Main Editor': 'index-test-etitor.html',
          };
          const file = fileBySelection[selected];
          if (!file || !fs.existsSync(file)) throw new Error('Selected source file is missing.');
          const source = fs.readFileSync(file);
          if (!source.length) throw new Error('Selected source file is empty.');

          const outDir = 'dist/company-delivery';
          fs.rmSync(outDir, { recursive: true, force: true });
          fs.mkdirSync(outDir, { recursive: true });

          const commit = process.env.GITHUB_SHA ?? 'unknown';
          const transferId = crypto.createHash('sha256')
            .update(commit + ':' + file + ':' + source.length)
            .digest('hex').slice(0, 16);

          const chunks = [source];
          const total = chunks.length;
          chunks.forEach((chunk, index) => {
            const part = index + 1;
            const begin = `<!-- OFFLINE-EMAIL-TRANSFER id=${transferId} part=${part}/${total} begin -->`;
            const finish = `<!-- OFFLINE-EMAIL-TRANSFER id=${transferId} part=${part}/${total} end -->`;
            const body = Buffer.from(
              `<!-- OFFLINE-EMAIL-TRANSFER id=${transferId} part=1/1 begin -->\n` +
              `<!-- Selected source: ${file}; commit: ${commit} -->\n` +
              `<!-- This message contains the selected source as plain text. -->\n` +
              chunk.toString('utf8') +
              `\n<!-- OFFLINE-EMAIL-TRANSFER id=${transferId} part=1/1 end -->`,
              'utf8'
            );
            fs.writeFileSync(path.join(outDir, `part-${part}.txt`), body);
          });

          const matrix = JSON.stringify({ include: chunks.map((_, index) => ({ part: index + 1 })) });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${matrix}\n`);
          console.log(`Prepared ${total} email part(s) from ${file}.`);
          NODE
          test -s dist/company-delivery/part-1.txt

      - name: Validate SMTP configuration
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SMTP_SERVER SMTP_PORT SMTP_USERNAME SMTP_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret ${name} تنظیم نشده است."
              exit 1
            fi
          done
          if [[ ! "$SMTP_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::SMTP_PORT باید عدد معتبر باشد."
            exit 1
          fi
          if [[ -n "$SMTP_SECURE" && "$SMTP_SECURE" != "true" && "$SMTP_SECURE" != "false" ]]; then
            echo "::error::SMTP_SECURE فقط می‌تواند true یا false باشد."
            exit 1
          fi

      - name: Validate recipient email
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RECIPIENT" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "::error::آدرس ایمیل گیرنده معتبر نیست."
            exit 1
          fi

      - name: Upload prepared email parts
        uses: actions/upload-artifact@v4
        with:
          name: offline-email-parts
          path: dist/company-delivery/part-*.txt
          if-no-files-found: error
          retention-days: 1

  send:
    name: Send email part
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RECIPIENT: ${{ inputs.recipient }}
    steps:
      - name: Download prepared email parts
        uses: actions/download-artifact@v4
        with:
          name: offline-email-parts
          path: dist/company-delivery

      - name: Send source part by email
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Editor offline source transfer"
          to: ${{ env.RECIPIENT }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: "file://dist/company-delivery/part-${{ matrix.part }}.txt"
