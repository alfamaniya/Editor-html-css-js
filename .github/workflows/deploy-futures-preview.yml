name: انتشار پیش‌نمایش Futures

on:
  push:
    branches:
      - main
    paths:
      - "futures/**"
      - ".github/workflows/deploy-futures-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: ساخت فایل آفلاین Futures
        run: node scripts/build-futures-offline.mjs

      - name: پیکربندی GitHub Pages
        uses: actions/configure-pages@v5

      - name: ساخت محتوای سایت با Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: بارگذاری خروجی آمادهٔ انتشار
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: انتشار پیش‌نمایش
        id: deployment
        uses: actions/deploy-pages@v4
