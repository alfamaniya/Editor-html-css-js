name: انتشار کنترل‌شدهٔ GitHub Pages

on:
  workflow_run:
    workflows:
      - ساخت و انتشار فایل مستقل editor v.html
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# انتشار فعال لغو نمی‌شود؛ فقط یک انتشار در هر زمان اجرا خواهد شد.
concurrency:
  group: github-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: دریافت آخرین نسخهٔ شاخهٔ اصلی
        uses: actions/checkout@v6
        with:
          ref: main

      - name: پیکربندی GitHub Pages
        uses: actions/configure-pages@v5

      - name: ساخت محتوای سایت با Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: بارگذاری خروجی آمادهٔ انتشار
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: انتشار نسخه در GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
