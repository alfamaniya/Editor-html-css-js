name: ارسال نسخه یکپارچه Futures با ایمیل

on:
  push:
    branches:
      - main
    paths:
      - "futures/**"
      - ".github/scripts/build-futures-single-file.mjs"
      - ".github/workflows/email-futures-single-file.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: futures-email-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: دریافت سورس پروژه
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: آماده‌سازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ساخت فایل HTML یکپارچه
        run: node .github/scripts/build-futures-single-file.mjs

      - name: بررسی تنظیمات ایمیل
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          FUTURES_EMAIL_TO: ${{ secrets.FUTURES_EMAIL_TO }}
        shell: bash
        run: |
          for name in SMTP_SERVER SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM FUTURES_EMAIL_TO; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub Actions Secret ${name} تنظیم نشده است."
              exit 1
            fi
          done

      - name: ارسال فایل HTML به ایمیل
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "پیش‌نمایش یکپارچه Futures"
          to: ${{ secrets.FUTURES_EMAIL_TO }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            نسخه یکپارچه و قابل‌مشاهده در مرورگر از پوشه futures به این ایمیل پیوست شده است.
          attachments: dist/futures-preview.html
