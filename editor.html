<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Single File Editor</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --panel-3: #0b1220;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #22c55e;
        --accent-3: #f59e0b;
        --danger: #ef4444;
        --shadow: rgba(15, 23, 42, 0.45);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 16px;
      }

      .app {
        width: min(1500px, 100%);
        height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 18px 60px var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 18px;
        background: linear-gradient(180deg, #111827 0%, #0b1220 100%);
        border-bottom: 1px solid var(--border);
      }

      .title {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: 1px solid var(--border);
        background: linear-gradient(180deg, #1f2937, #111827);
        color: var(--text);
        border-radius: 10px;
        padding: 9px 14px;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      }

      button:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25);
      }

      button.primary {
        background: linear-gradient(180deg, #0ea5e9, #0369a1);
        border-color: rgba(125, 211, 252, 0.7);
      }

      .editor-shell {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .editor-panel {
        flex: 1 1 52%;
        min-width: 240px;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-right: 1px solid var(--border);
      }

      .tabs {
        display: flex;
        padding: 8px 10px 0;
        gap: 6px;
        background: #0b1220;
        border-bottom: 1px solid var(--border);
      }

      .tab {
        background: #1e293b;
        color: var(--muted);
        border: 1px solid var(--border);
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        padding: 8px 12px;
        font-size: 0.85rem;
        font-weight: 700;
      }

      .tab.active {
        background: linear-gradient(180deg, #1d4ed8, #1e3a8a);
        color: white;
        border-color: rgba(147, 197, 253, 0.6);
      }

      .code-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      textarea {
        width: 100%;
        height: 100%;
        resize: none;
        border: 0;
        padding: 16px;
        background: #0b1220;
        color: var(--text);
        font: 14px/1.6 "Consolas", "Courier New", monospace;
        outline: none;
        tab-size: 2;
      }

      textarea.hidden {
        display: none;
      }

      .divider {
        width: 10px;
        background: linear-gradient(180deg, #1e293b, #111827);
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
        cursor: col-resize;
        position: relative;
      }

      .divider::before {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 2px;
        height: 70px;
        border-radius: 3px;
        background: rgba(148, 163, 184, 0.9);
      }

      .preview-panel {
        flex: 1 1 48%;
        min-width: 260px;
        background: var(--panel-2);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }

      @media (max-width: 920px) {
        body {
          padding: 8px;
        }

        .app {
          height: calc(100vh - 16px);
        }

        .editor-shell {
          flex-direction: column;
        }

        .divider {
          width: 100%;
          height: 10px;
          border-top: 1px solid var(--border);
          border-bottom: 1px solid var(--border);
          cursor: row-resize;
        }

        .divider::before {
          width: 70px;
          height: 2px;
        }

        .editor-panel,
        .preview-panel {
          min-height: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 class="title">Single File Editor</h1>
        <div class="actions">
          <button id="runBtn" class="primary">Run</button>
          <button id="resetBtn">Reset</button>
          <button id="downloadBtn">Download</button>
        </div>
      </header>

      <div class="editor-shell" id="editorShell">
        <div class="editor-panel" id="editorPanel">
          <div class="tabs">
            <button class="tab active" data-tab="html" type="button">HTML</button>
            <button class="tab" data-tab="css" type="button">CSS</button>
            <button class="tab" data-tab="js" type="button">JS</button>
          </div>

          <div class="code-wrap">
            <textarea id="htmlCode" spellcheck="false"></textarea>
            <textarea id="cssCode" class="hidden" spellcheck="false"></textarea>
            <textarea id="jsCode" class="hidden" spellcheck="false"></textarea>
          </div>
        </div>

        <div class="divider" id="divider" aria-label="Resize editor"></div>

        <div class="preview-panel">
          <iframe id="preview" title="Live Preview"></iframe>
        </div>
      </div>
    </div>

    <script>
      const defaultCode = {
        html: `<!DOCTYPE html>
<html lang="en">
  <body>
    <div class="card">
      <h1>Hello from the editor</h1>
      <p>Write your HTML, CSS, and JavaScript here.</p>
      <button id="demoBtn">Click me</button>
    </div>
  </body>
</html>`,
        css: `body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #0f172a, #1d4ed8);
  font-family: Arial, sans-serif;
}

.card {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.24);
  backdrop-filter: blur(12px);
  width: min(460px, 90vw);
  padding: 32px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  color: white;
  text-align: center;
}

button {
  margin-top: 12px;
  background: #22c55e;
  border: 0;
  color: white;
  border-radius: 10px;
  padding: 10px 18px;
  cursor: pointer;
  font-weight: 700;
}`,
        js: `document.getElementById('demoBtn')?.addEventListener('click', () => {
  alert('Hello from JavaScript!');
});`
      };

      const STORAGE_KEY = 'single-file-editor-v1';
      const htmlCode = document.getElementById('htmlCode');
      const cssCode = document.getElementById('cssCode');
      const jsCode = document.getElementById('jsCode');
      const preview = document.getElementById('preview');
      const editorShell = document.getElementById('editorShell');
      const divider = document.getElementById('divider');
      const tabs = [...document.querySelectorAll('.tab')];
      const codeMap = { html: htmlCode, css: cssCode, js: jsCode };
      let activeTab = 'html';
      let dragging = false;

      function loadState() {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        const data = saved || defaultCode;

        htmlCode.value = data.html ?? defaultCode.html;
        cssCode.value = data.css ?? defaultCode.css;
        jsCode.value = data.js ?? defaultCode.js;
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          html: htmlCode.value,
          css: cssCode.value,
          js: jsCode.value
        }));
      }

      function setActiveTab(tabName) {
        activeTab = tabName;
        tabs.forEach(tab => {
          const isActive = tab.dataset.tab === tabName;
          tab.classList.toggle('active', isActive);
        });

        Object.entries(codeMap).forEach(([key, textarea]) => {
          textarea.classList.toggle('hidden', key !== tabName);
        });
      }

      function renderPreview() {
        const html = htmlCode.value;
        const css = cssCode.value;
        const js = jsCode.value;

        const srcDoc = `
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <style>${css}</style>
            </head>
            <body>
              ${html}
              <script>
                try {
                  ${js}
                } catch (error) {
                  console.error(error);
                  const p = document.createElement('pre');
                  p.style.color = 'red';
                  p.style.fontFamily = 'monospace';
                  p.style.margin = '16px';
                  p.textContent = 'JavaScript Error:\n' + error.stack;
                  document.body.appendChild(p);
                }
              <\/script>
            </body>
          </html>
        `;

        preview.srcdoc = srcDoc;
        saveState();
      }

      tabs.forEach(tab => {
        tab.addEventListener('click', () => setActiveTab(tab.dataset.tab));
      });

      [htmlCode, cssCode, jsCode].forEach(textarea => {
        textarea.addEventListener('input', renderPreview);
      });

      document.getElementById('runBtn').addEventListener('click', renderPreview);

      document.getElementById('resetBtn').addEventListener('click', () => {
        htmlCode.value = defaultCode.html;
        cssCode.value = defaultCode.css;
        jsCode.value = defaultCode.js;
        renderPreview();
      });

      document.getElementById('downloadBtn').addEventListener('click', () => {
        const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exported Page</title>
  <style>${cssCode.value}</style>
</head>
<body>
  ${htmlCode.value}
  <script>
    try {
      ${jsCode.value}
    } catch (error) {
      console.error(error);
    }
  <\/script>
</body>
</html>`;

        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'exported-page.html';
        a.click();
        URL.revokeObjectURL(url);
      });

      divider.addEventListener('pointerdown', (event) => {
        dragging = true;
        divider.setPointerCapture(event.pointerId);
      });

      divider.addEventListener('pointermove', (event) => {
        if (!dragging) return;

        const rect = editorShell.getBoundingClientRect();
        const isVertical = window.innerWidth > 920;

        if (isVertical) {
          const x = event.clientX - rect.left;
          const percent = (x / rect.width) * 100;
          const clamped = Math.min(Math.max(percent, 25), 75);
          document.getElementById('editorPanel').style.flexBasis = `${clamped}%`;
        } else {
          const y = event.clientY - rect.top;
          const percent = (y / rect.height) * 100;
          const clamped = Math.min(Math.max(percent, 25), 75);
          document.getElementById('editorPanel').style.flexBasis = `${clamped}%`;
        }
      });

      divider.addEventListener('pointerup', () => dragging = false);
      divider.addEventListener('pointerleave', () => dragging = false);

      loadState();
      setActiveTab(activeTab);
      renderPreview();
    </script>
  </body>
</html>
