<div class="editor-header">
  <div class="editor-header-title">
    <span class="heading-dot editor-dot" aria-hidden="true"></span>
    <span>EDITOR</span>
    <span class="editor-file-count">3 FILES</span>
  </div>
  <div class="editor-header-actions" aria-label="Editor actions">
    <button class="editor-action-button" type="button" aria-label="Undo" title="Undo"><span aria-hidden="true">↶</span><span>Undo</span></button>
    <button class="editor-action-button" type="button" aria-label="Redo" title="Redo"><span aria-hidden="true">↷</span><span>Redo</span></button>
    <span class="editor-action-divider" aria-hidden="true"></span>
    <button class="editor-action-button clear-action" type="button" aria-label="Clear active file" title="Clear active file"><span aria-hidden="true">⌫</span><span>Clear</span></button>
  </div>
</div>
<div class="editor-tabs" role="tablist" aria-label="Open files">
  <div class="editor-tab is-active" role="tab" aria-selected="true"><span class="file-type-icon html-icon" aria-hidden="true">5</span><span class="tab-name">index.html</span><button class="tab-close" type="button" aria-label="Close index.html">×</button></div>
  <div class="editor-tab" role="tab" aria-selected="false"><span class="file-type-icon css-icon" aria-hidden="true">#</span><span class="tab-name">style.css</span><button class="tab-close" type="button" aria-label="Close style.css">×</button></div>
  <div class="editor-tab" role="tab" aria-selected="false"><span class="file-type-icon js-icon" aria-hidden="true">JS</span><span class="tab-name">script.js</span><button class="tab-close" type="button" aria-label="Close script.js">×</button></div>
  <div class="editor-tabs-spacer"></div>
</div>
