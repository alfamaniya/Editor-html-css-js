<div class="file-manager" aria-label="Project files">
  <div class="file-manager-toolbar">
    <span class="file-manager-project">PROJECT</span>
    <span class="file-manager-root-name">workspace</span>
  </div>
  <div class="file-tree" role="tree" aria-label="Project file tree">
    <button class="file-tree-item is-active" type="button" role="treeitem" data-open-file="html" aria-selected="true">
      <span class="file-tree-icon html-icon" aria-hidden="true">&lt;&gt;</span><span>index.html</span>
    </button>
    <button class="file-tree-item" type="button" role="treeitem" data-open-file="css" aria-selected="false">
      <span class="file-tree-icon css-icon" aria-hidden="true">#</span><span>style.css</span>
    </button>
    <button class="file-tree-item" type="button" role="treeitem" data-open-file="javascript" aria-selected="false">
      <span class="file-tree-icon js-icon" aria-hidden="true">JS</span><span>script.js</span>
    </button>
  </div>
  <div class="file-manager-footer"><span class="file-manager-status-dot" aria-hidden="true"></span><span>3 files in workspace</span></div>
</div>
