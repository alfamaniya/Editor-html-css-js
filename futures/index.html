<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Early visual draft of the code editor workspace">
  <title>Code Workspace — UI Draft</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./file-manager/style.css">
  <link rel="stylesheet" href="./right-menu/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <span>CODE WORKSPACE</span>
      </div>
      <div class="header-center">Development Environment</div>
      <div class="header-side">Early UI Preview</div>
    </header>

    <main class="workspace">
      <aside class="side-menu left-menu" aria-label="File Manager">
        <div class="panel-heading">
          <span class="menu-title">FILES</span>
          <button class="menu-toggle" type="button" data-menu-toggle="left" aria-label="Collapse File Manager" aria-expanded="true" title="Collapse File Manager">
            <span class="toggle-icon" aria-hidden="true">‹</span>
          </button>
        </div>
        <div class="menu-placeholder">
          <span class="placeholder-icon" aria-hidden="true">▤</span>
          <span>File Manager Area</span>
        </div>
      </aside>

      <section class="work-panel editor-panel" aria-label="Code Editor">
        <div class="section-heading">
          <span class="heading-dot editor-dot"></span>
          <span>EDITOR</span>
          <span class="heading-caption">Code Editing Area</span>
        </div>
        <div class="editor-surface">
          <div class="empty-state">
            <span class="empty-symbol" aria-hidden="true">&lt;/&gt;</span>
            <span>Editor Workspace</span>
          </div>
        </div>
        <section class="terminal-panel" aria-label="Editor Terminal">
          <div class="terminal-heading">
            <span>TERMINAL</span>
            <span class="terminal-caption">Editor Terminal</span>
          </div>
          <div class="terminal-surface"></div>
        </section>
      </section>

      <section class="work-panel preview-panel" aria-label="Live Preview">
        <div class="section-heading">
          <span class="heading-dot preview-dot"></span>
          <span>LIVE PREVIEW</span>
          <span class="heading-caption">Live Output</span>
        </div>
        <div class="preview-surface">
          <div class="empty-state">
            <span class="preview-frame" aria-hidden="true">▱</span>
            <span>Preview Workspace</span>
          </div>
        </div>
        <section class="terminal-panel" aria-label="Preview Terminal">
          <div class="terminal-heading">
            <span>TERMINAL</span>
            <span class="terminal-caption">Preview Terminal</span>
          </div>
          <div class="terminal-surface"></div>
        </section>
      </section>

      <aside class="side-menu right-menu" aria-label="Right Sidebar">
        <div class="panel-heading">
          <button class="menu-toggle" type="button" data-menu-toggle="right" aria-label="Collapse Right Sidebar" aria-expanded="true" title="Collapse Right Sidebar">
            <span class="toggle-icon" aria-hidden="true">›</span>
          </button>
          <span class="menu-title">SIDEBAR</span>
        </div>
        <div class="menu-placeholder">
          <span class="placeholder-icon" aria-hidden="true">▧</span>
          <span>Right Sidebar Area</span>
        </div>
      </aside>
    </main>
  </div>
  <script src="./script.js"></script>
  <script src="./file-manager/script.js"></script>
  <script src="./right-menu/script.js"></script>
</body>
</html>
