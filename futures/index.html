<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="طرح ظاهری اولیه ویرایشگر کد">
  <title>Code Workspace — UI Draft</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
        <span>CODE WORKSPACE</span>
      </div>
      <div class="header-center">محیط توسعه</div>
      <div class="header-side">طرح اولیه رابط کاربری</div>
    </header>

    <main class="workspace">
      <aside class="side-menu left-menu" aria-label="منوی سمت چپ">
        <div class="panel-heading">
          <span>فایل‌ها</span>
          <span class="panel-symbol" aria-hidden="true">‹</span>
        </div>
        <div class="menu-placeholder">
          <span class="placeholder-icon" aria-hidden="true">▤</span>
          <span>فضای منوی سمت چپ</span>
        </div>
      </aside>

      <section class="work-panel editor-panel" aria-label="محیط ویرایشگر">
        <div class="section-heading">
          <span class="heading-dot editor-dot"></span>
          <span>EDITOR</span>
          <span class="heading-caption">محیط ویرایش کد</span>
        </div>
        <div class="editor-surface">
          <div class="empty-state">
            <span class="empty-symbol" aria-hidden="true">&lt;/&gt;</span>
            <span>محیط ویرایشگر</span>
          </div>
        </div>
        <section class="terminal-panel" aria-label="ترمینال ویرایشگر">
          <div class="terminal-heading">
            <span>TERMINAL</span>
            <span class="terminal-caption">ترمینال ویرایشگر</span>
          </div>
          <div class="terminal-surface"></div>
        </section>
      </section>

      <section class="work-panel preview-panel" aria-label="محیط نمایش زنده">
        <div class="section-heading">
          <span class="heading-dot preview-dot"></span>
          <span>LIVE PREVIEW</span>
          <span class="heading-caption">نمایش زنده</span>
        </div>
        <div class="preview-surface">
          <div class="empty-state">
            <span class="preview-frame" aria-hidden="true">▱</span>
            <span>محیط لایو</span>
          </div>
        </div>
        <section class="terminal-panel" aria-label="ترمینال نمایش زنده">
          <div class="terminal-heading">
            <span>TERMINAL</span>
            <span class="terminal-caption">ترمینال لایو</span>
          </div>
          <div class="terminal-surface"></div>
        </section>
      </section>

      <aside class="side-menu right-menu" aria-label="منوی سمت راست">
        <div class="panel-heading">
          <span class="panel-symbol" aria-hidden="true">›</span>
          <span>منوی کناری</span>
        </div>
        <div class="menu-placeholder">
          <span class="placeholder-icon" aria-hidden="true">▧</span>
          <span>فضای منوی سمت راست</span>
        </div>
      </aside>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
