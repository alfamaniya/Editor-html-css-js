<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Futures — Offline Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #080B0D;
      color: #E6F0F0;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 560px);
      padding: 28px;
      border: 1px solid #263438;
      border-radius: 14px;
      background: #111719;
    }
    h1 { margin: 0 0 12px; color: #55E5D9; font-size: 1.35rem; }
    p { margin: 0; color: #91A5A5; line-height: 1.7; }
    code { color: #55E5D9; }
  </style>
</head>
<body>
  <main>
    <h1>Futures Offline Dashboard</h1>
    <p>This is the standalone offline build target for the Futures workspace. The self-contained application bundle will be generated here from the Futures source files.</p>
  </main>
</body>
</html>
